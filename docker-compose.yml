services:
  db:
    image: postgres:16
    container_name: tbscreenai-db
    environment:
      POSTGRES_USER: tbscreen
      POSTGRES_PASSWORD: tbscreen_dev
      POSTGRES_DB: tbscreenai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbscreen -d tbscreenai"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # Pinned so dev and CI run the same server. Pulled from quay.io because
    # MinIO withdrew minio/minio from Docker Hub in September 2026; same image,
    # same tag, different registry. Bump deliberately, together with the tag in
    # .github/workflows/backend.yml.
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    container_name: tbscreenai-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tbscreen
      MINIO_ROOT_PASSWORD: tbscreen_dev_storage
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console, development convenience only
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  storagedata:
