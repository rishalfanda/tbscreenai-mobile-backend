services:
  db:
    image: postgres:16
    container_name: tbscreenai-db
    environment:
      POSTGRES_USER: tbscreen
      POSTGRES_PASSWORD: tbscreen_dev
      POSTGRES_DB: tbscreenai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tbscreen -d tbscreenai"]
      interval: 5s
      timeout: 3s
      retries: 10

  storage:
    # Object storage for chest X-rays. Images do not belong in Postgres: a
    # single study is megabytes where a record is kilobytes, and mixing them
    # makes backups slow and replication heavy. MinIO speaks the S3 API, so
    # the same client works against anything else later.
    #
    # Pin a release tag before this reaches a real deployment.
    image: minio/minio:latest
    container_name: tbscreenai-storage
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: tbscreen
      MINIO_ROOT_PASSWORD: tbscreen_dev_storage
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # web console, development convenience only
    volumes:
      - storagedata:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
  storagedata:
